{% extends 'base.html' %}
{% block content %}

<style>
    .attendance-form-card {
        border-radius: 18px;
        transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
        border: 1px solid transparent;
    }

    .attendance-form-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
        border-color: #dbeafe;
    }

    .attendance-save-btn {
        transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        border-radius: 12px;
    }

    .attendance-save-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(37, 99, 235, 0.18);
        filter: brightness(1.03);
    }
</style>

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="mb-1">Add Attendance</h2>
        <p class="text-muted mb-0">Create a new attendance entry for an employee.</p>
    </div>

    <a href="/attendance/" class="btn btn-outline-secondary px-4 py-2 attendance-save-btn">
        ← Back to Attendance
    </a>
</div>

<div class="card shadow-sm p-4 attendance-form-card" style="max-width:700px;">
    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label fw-semibold">Employee</label>
            <select name="employee" class="form-control">
                {% for employee in employees %}
                    <option value="{{ employee.id }}">{{ employee.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Date</label>
            <input type="date" name="date" class="form-control">
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold">Status</label>
            <select name="status" class="form-control">
                <option value="Present">Present</option>
                <option value="Absent">Absent</option>
                <option value="Late">Late</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary attendance-save-btn px-4 py-2">
            Save Attendance
        </button>
    </form>
</div>

{% endblock %}

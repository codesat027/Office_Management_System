{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
    <div class="d-flex align-items-center mb-4">
<a href="{% url 'task_list' %}" class="me-3 text-decoration-none d-flex align-items-center justify-content-center" 
           style="width: 45px; height: 45px; border: 2px solid #333; border-radius: 50%; background: transparent; transition: all 0.2s ease;">
           <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#333" viewBox="0 0 16 16">
              <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/>
           </svg>
        </a>
        <h2 class="fw-bold mb-0">Create New Task</h2>
    </div>

    <form method="POST" class="card p-4 shadow border-0" style="border-radius: 15px;">
        {% csrf_token %}
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="fw-bold mb-2">Assign To (Select Employee)</label>
                <select name="employee" class="form-select border-2" required>
                    <option value="">Choose Employee...</option>
                    {% for emp in employees %}
                    <option value="{{ emp.id }}">{{ emp.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="fw-bold mb-2">Task Title</label>
                <input type="text" name="title" class="form-control border-2" required placeholder="e.g. Server Maintenance">
            </div>
        </div>

        <div class="mb-3">
            <label class="fw-bold mb-2">Task Description</label>
            <textarea name="description" class="form-control border-2" rows="3"></textarea>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="fw-bold mb-2">Deadline</label>
                <input type="date" name="deadline" class="form-control border-2">
            </div>
            <div class="col-md-4 mb-3">
                <label class="fw-bold mb-2">Priority</label>
                <select name="priority" class="form-select border-2">
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>
                    <option value="Urgent">Urgent</option>
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label class="fw-bold mb-2">Status</label>
                <select name="status" class="form-select border-2">
                    <option value="Pending">Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>
                </select>
            </div>
        </div>

        <div class="mb-4 col-md-3">
            <label class="fw-bold mb-2">Initial Progress (%)</label>
            <input type="number" name="progress" class="form-control border-2" value="0" min="0" max="100">
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm">Create & Assign Task</button>
    </form>
</div>
{% endblock %}

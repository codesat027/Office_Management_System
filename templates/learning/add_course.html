{% extends 'base.html' %}
{% block content %}

<style>
    .add-course-card {
        border-radius: 18px;
        transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
        border: 1px solid transparent;
        max-width: 760px;
    }

    .add-course-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
        border-color: #dbeafe;
    }

    .add-course-btn {
        border-radius: 12px;
        transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .add-course-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(37, 99, 235, 0.18);
    }
</style>

<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
    <div>
        <h2 class="mb-1">Add Course</h2>
        <p class="text-muted mb-0">Create a new learning course with title, description, and image.</p>
    </div>

    <a href="/learning/" class="btn btn-outline-secondary add-course-btn px-4 py-2">
        ← Back to Learning
    </a>
</div>

<div class="card shadow-sm border-0 p-4 add-course-card">
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label fw-semibold">Course Title</label>
            <input type="text" name="title" class="form-control" placeholder="Enter course title" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Description</label>
            <textarea name="description" class="form-control" rows="5" placeholder="Enter course description" required></textarea>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold">Course Image</label>
            <input type="file" name="image" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary add-course-btn px-4 py-2">
            Save Course
        </button>
    </form>
</div>

{% endblock %}

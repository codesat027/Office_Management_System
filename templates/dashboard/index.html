<h3 class="mt-4 mb-3">Recent Notes</h3>

<div class="card shadow-sm p-4">

    {% for notice in notices %}
        <div class="card border-0 shadow-sm mb-3 p-3" style="border-radius:16px;">
            <div class="d-flex justify-content-between">

                <div class="d-flex">
                    <div style="width:50px; height:50px; border-radius:10px; background:#eaf3ff; display:flex; align-items:center; justify-content:center; font-size:22px; margin-right:12px;">
                        📋
                    </div>

                    <div>
                        <h6 class="fw-bold mb-1">{{ notice.title }}</h6>
                        <small class="text-muted">{{ notice.created_at|timesince }} ago</small>
                    </div>
                </div>

                <small class="text-muted">{{ notice.created_at|timesince }} ago</small>

            </div>
        </div>
    {% empty %}
        <p>No notices available.</p>
    {% endfor %}

    <div class="text-center mt-3">
        <a href="/notices/" class="btn btn-outline-primary px-4 py-2" style="border-radius:25px;">
            View All Notes →
        </a>
    </div>

</div>
